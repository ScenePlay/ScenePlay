[project]
name = "sceneplay"
version = "2.0.27"
description = "Self-hosted atmosphere controller for tabletop gaming: music/video via mpv, LED lighting, TTRPG toolkit, remote-play relay and OBS control (FastAPI + SQLite + single-page app)"
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies — kept in step with requirements.txt (the installers
# use that file; this list is the same set for tooling that reads pyproject).
dependencies = [
    "fastapi~=0.139",
    "uvicorn[standard]~=0.49; sys_platform == 'linux'",
    "uvicorn~=0.49; sys_platform == 'win32'",
    "sse-starlette>=2.1,<4",
    "pydantic~=2.12",
    "python-multipart~=0.0.20",
    "SQLAlchemy~=2.0.50",
    "alembic~=1.16",
    "bcrypt~=4.3",
    "PyJWT~=2.10",
    "requests~=2.34.2",
    "websocket-client~=1.8",
    "Pillow~=12.2.0",
    "qrcode~=8.2",
    "python-crontab~=3.3.0; sys_platform == 'linux'",
    "gTTS~=2.5.4",
    "psutil~=7.2.2",
    "yt-dlp",
    "pulsectl~=24.12.0; sys_platform == 'linux'",
    "pycaw==20240210; sys_platform == 'win32'",
    "comtypes~=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest~=9.1", "httpx~=0.28", "ruff~=0.15", "playwright"]
# Raspberry Pi / LED hardware only
pi = ["rpi_ws281x", "adafruit-circuitpython-neopixel", "adafruit-blinka"]
