# ScenePlay fallback hotspot: phone / OS "is there internet?" probes.
# Installed to /etc/nginx/snippets/ by supportFiles/setupNetwatch.sh and pulled
# into the ScenePlay site by `include snippets/sceneplay-captive*.conf;`.
# These hostnames only reach this box while the hotspot's DNS points every
# name here, so on a normal LAN these locations are never hit. Answering with
# a redirect (instead of the expected 204 / "Success") is what makes the
# phone open its "sign in to network" popup on the setup page.
location = /generate_204               { return 302 http://10.42.0.1/setup/wifi; }   # Android / Chrome
location = /gen_204                    { return 302 http://10.42.0.1/setup/wifi; }
location = /hotspot-detect.html        { return 302 http://10.42.0.1/setup/wifi; }   # Apple
location = /library/test/success.html  { return 302 http://10.42.0.1/setup/wifi; }
location = /connecttest.txt            { return 302 http://10.42.0.1/setup/wifi; }   # Windows
location = /ncsi.txt                   { return 302 http://10.42.0.1/setup/wifi; }
location = /redirect                   { return 302 http://10.42.0.1/setup/wifi; }
location = /canonical.html             { return 302 http://10.42.0.1/setup/wifi; }   # Firefox
location = /success.txt                { return 302 http://10.42.0.1/setup/wifi; }
